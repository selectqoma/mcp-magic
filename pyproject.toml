[project]
name = "mcp-magic"
version = "0.1.0"
description = "Government Contracts & Grants Intelligence MCP Server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "fastmcp>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "Pillow>=10.0.0",
    "anthropic>=0.30.0",
    "openai>=1.40.0",
    "numpy>=1.26.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pytesseract>=0.3.10",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "resend>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
